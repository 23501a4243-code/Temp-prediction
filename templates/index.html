<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Temperature Tolerance Predictor
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">

        <div class="header">

            <h1>
                Temperature Tolerance Predictor
            </h1>

            <p>
                Enter your details to predict
                your comfortable temperature
            </p>

        </div>


        <div class="card">

            <form id="predictionForm">


                <!-- AGE -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        min="0"
                        max="100"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select
                        id="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="others">
                            Others
                        </option>

                    </select>

                </div>


                <!-- DIABETES -->

                <div class="form-group">

                    <label>
                        Diabetes
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="diabetes"
                                value="Yes"
                                required
                            >
                            Yes
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="diabetes"
                                value="No"
                            >
                            No
                        </label>

                    </div>

                </div>


                <!-- BP -->

                <div class="form-group">

                    <label>
                        B.P
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="bp"
                                value="Yes"
                                required
                            >
                            Yes
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="bp"
                                value="No"
                            >
                            No
                        </label>

                    </div>

                </div>


                <!-- SPO2 -->

                <div class="form-group">

    <label>
        SpO2
    </label>

    <select id="spo2" required>

        <option value="">
            Select SpO2 range
        </option>

        <option value="95-100">
            95-100
        </option>

        <option value="90-94">
            90-94
        </option>

        <option value="<90">
            &lt;90
        </option>

    </select>

</div>
                <!-- BASIC HEALTH -->

                <div class="form-group">

                    <label>
                        Basic Health Issues
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="basic_health"
                                value="Yes"
                                required
                            >
                            Yes
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="basic_health"
                                value="No"
                            >
                            No
                        </label>

                    </div>

                </div>


                <!-- FAMILY HEALTH -->

                <div class="form-group">

                    <label>
                        Family's Health Issues
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="family_health"
                                value="Yes"
                                required
                            >
                            Yes
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="family_health"
                                value="No"
                            >
                            No
                        </label>

                    </div>

                </div>


                <!-- BUTTON -->

                <button type="submit">

                    Predict Temperature

                </button>


            </form>


            <!-- RESULT -->

            <div
                id="result"
                class="result hidden"
            >

                <h2>
                    Predicted Temperature
                </h2>

                <div
                    id="temperature"
                    class="temperature"
                >
                    -- °C
                </div>

            </div>


            <!-- ERROR -->

            <div
                id="error"
                class="error hidden"
            ></div>


        </div>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
